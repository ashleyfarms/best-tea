[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Shared places API (Neon) — force ahead of SPA fallback
# Permanent hostname redirect: netlify.app -> clean custom domain
[[redirects]]
  from = "https://best-tea-poss-jonah.netlify.app/*"
  to = "https://tea.possjonah.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# SPA fallback for react-router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
